# What this project needs from its devstack container. Generated by `devstack up`; commit it.
# It holds container-side settings only: nothing about the host it was built on.
#
# To build the environment on your machine, write your own config (keep it outside
# this repo) with these values as its defaults:
#   ./devstack init --project <this folder>
# then read it, and run `./devstack up -c <your config>`.

[project]
# Where the project folder is mounted inside the container (idmapped, so files keep your
# uid). Kept outside /home so Caddy and the hardened service can read it.
container_path = "/srv/proj"
# Extra files and folders inside the project to mount read-only in the container, so
# code running there cannot edit what the host later runs, e.g. '.vscode' if you open
# the project on the host. The whole .git is always read-only (the host runs git on it)
# and needs no entry here. Relative to project.host_path. A path that doesn't exist yet
# is mounted by the next `up` once it does.
readonly_paths = []

[container]
# Image to launch. Debian 13 (trixie) by default: current stable. The container shares
# the host kernel (and GPU driver, if passed through) whatever the image.
image = "images:debian/13"
# What the container user may do as root. 'limited': only `sudo devstack-sync` (install
# listed apt packages, restart the app/runners, reload Caddy), so nothing the user or an
# agent can edit runs as root. 'full': passwordless sudo for everything (the user, and
# every agent running as it, is root in the container; needs your OK). 'none': no sudo.
# Root for you is always `incus exec <container> -- bash` from the host.
sudo = "limited"

[gpu]
# Pass the host GPU into the container.
enabled = true

[node]
# Exact Node.js version (verified with the release keys).
version = "24.20.0"
# pnpm version for corepack (`corepack use pnpm@<v>` pins it, with its hash, in
# package.json's packageManager). Exact and at least a week old, like the dependencies
# pnpm-workspace.yaml lets in; 'latest' takes whatever was published last. 10.26.0 or
# later.
pnpm_version = "12.8.1"
# Where the Node tarball is unpacked.
install_prefix = "/usr/local"

[site]
# The app's intended production hostname. Dev URL = https://<hostname>.<dns.tld>.
hostname = "app"

[caddy]
# Generate <project>/infra/Caddyfile. Set false to maintain it yourself (it must then
# exist before phase 'proxy').
manage_caddyfile = false
# Static root.
static_dir = "/srv/proj/static"
# Error / catch-all page root.
error_dir = "/srv/proj/error"
# Which browser requests the site accepts: the snippet devstack_same_origin, defined in
# the root-owned /etc/caddy/Caddyfile and imported by every site block. 'strict': only
# the site's own pages; a request a browser marks as coming from another site (a foreign
# Origin, or Sec-Fetch-Site cross-site or same-site) gets a bare 403. Typed URLs,
# bookmarks and tools that send no browser headers (curl, agents) pass. 'allow-
# navigation': also top-level GET navigations from other sites (links in, OAuth or
# payment redirects back). 'off': no check. No CORS headers in any mode.
same_origin = "strict"
# Largest request body the site accepts (Caddy request_body max_size, e.g. '10MB',
# '4GiB'); bigger requests get 413. Empty = no limit. Written into the generated
# Caddyfile only.
max_request_body = ""

# Security headers (phase standards). The error page's inline <style> hash is added to
# style-src automatically.
[caddy.headers]
Content-Security-Policy = "default-src 'self'; style-src 'self'; worker-src 'self' blob:; script-src 'self'; img-src 'self' data:; frame-src 'self'; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; media-src blob: 'self'; object-src 'none'; upgrade-insecure-requests;"
Referrer-Policy = "strict-origin-when-cross-origin"
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"

# Dev servers in the container (Vite, Storybook, ...), each served by Caddy at
# https://<name>.<dev host>/ with /api/* going to the app, so the page and its API share
# one origin. name = "port", e.g. { vite = "5173" }; the server listens on localhost in
# the container. Reach them with the dev browser (`devstack browse vite`), not a
# forwarded port: it can't reach your host's loopback. No security headers there: a dev
# server's inline scripts and HMR websocket would break the CSP.
[caddy.dev_servers]
vite = "5173"

[app]
# systemd unit name (without .service).
service_name = "memex-app"
# Listen address. Loopback only, by design.
bind = "127.0.0.1"
# Listen port.
port = 8080
# Entry file, relative to the project folder.
entry = "server.ts"
# What the app may reach going out, enforced by nftables on its uid. 'local': loopback
# only (Caddy, Postgres, runners), no DNS. 'internet': loopback plus the public internet
# (never the host or private ranges). 'open': no restriction (needs your OK).
profile = "local"
# The app's writable data folder at /var/lib/<isolation.app_user> ($STATE_DIRECTORY in
# the app). 'volume': an incus custom volume (app.data_volume) that survives rebuilds
# like the Postgres data. 'host': a host folder (app.data_source); files in it belong to
# the service uid, so your host user can't read them without sudo. 'none': the app has
# no writable folder.
data = "volume"

# Runners: tools that need the internet or parse untrusted files, without a daemon. Each
# entry: name, command (project-relative, run as isolation.runner_user), port (127.0.0.1
# only), and optionally memory_max (default '1G'), runtime_max (default '1h'),
# max_connections (default 4). Every connection to the port starts one job with the
# connection as stdin/stdout. Runners get the public internet, no loopback, no secrets,
# and can only write <app data>/incoming. A new or changed runner needs your OK.
[[app.runners]]
name = "ytdlp"
command = "node scripts/runners/ytdlp.ts"
port = 9101
memory_max = "1G"
runtime_max = "2h"
max_connections = 1
[[app.runners]]
name = "encode"
command = "node scripts/runners/encode.ts"
port = 9102
memory_max = "1G"
runtime_max = "1h"
max_connections = 1

[firewall]
# Enable ufw in the container.
enabled = true
# TCP ports allowed in.
allow = [22, 80, 443]
# Extra TCP ports denied (app.port, postgres.port and runner ports are always denied).
deny = []

[secrets]
# Root-only secrets folder in the container.
dir = "/etc/app-secrets"
# Caddy -> app shared token (INTERNAL_TOKEN=...).
token_file = "internal-token.env"

[checkpoint]
# Ignored folders (any depth) a checkpoint leaves out because checkpoint.restore_command
# rebuilds them.
derived = ["node_modules", "dist", "build", ".next", ".turbo", ".cache"]
# Run in the project folder in the container (as the container user) after a restore, to
# rebuild checkpoint.derived. Empty = nothing.
restore_command = "test ! -f package.json || pnpm install --frozen-lockfile"

[postgres]
# Run the postgres phase.
enabled = true
# Major version from apt.postgresql.org.
version = 18
# Port (loopback only).
port = 5432
# Fixed uid/gid of the postgres OS user, so data on a reused volume keeps its owner.
# Mid-range on purpose: Debian hands out system ids downward from 999.
system_uid = 500
# App database name.
db = "memex"
# App login role.
role = "memex_app"
# Empty database for integration tests, owned by the app role ("" = none). Not backed
# up. The container user gets its URL as TEST_DATABASE_URL in
# ~/.config/devstack/<stack>.env.
test_db = "memex_test"
# Credentials file in secrets.dir (DATABASE_URL, PG* vars), given to the app unit.
env_file = "postgres.env"
# Write ~/.pgpass for the container user so `psql` just works.
write_pgpass = true

[sbom]
# Folder inside the project for the generated CycloneDX files (container.cdx.json,
# app.cdx.json). Relative to the project folder, and committed with it.
dir = "infra/sbom"
# How the app inventory is taken. 'lockfile': scan the project without node_modules
# (pnpm-lock.yaml is authoritative and deterministic). 'tree': also scan node_modules,
# for a project whose packages the lockfile parser misses.
app_source = "lockfile"

# Host folders: none required.
